    <circle cx="36" cy="36" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="21" cy="24" r="3" fill="#00f0ff" />
    <circle cx="51" cy="24" r="3" fill="#00f0ff" />
    <circle cx="21" cy="48" r="3" fill="#3b82f6" />
    <circle cx="51" cy="48" r="3" fill="#3b82f6" />

    <!-- Typography -->
    <text x="76" y="38" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="1.5">AMPUH <tspan fill="#00f0ff">GEN 1</tspan></text>
    <text x="78" y="54" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="9" fill="#94a3b8" letter-spacing="3.5">TACTICAL GCS</text>
